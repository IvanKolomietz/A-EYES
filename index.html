<style>

<body>
<!-- Buttons sit above the paper so a resting hand can't press them. -->
<div class="bar" id="bar">
  <button id="eraser" aria-pressed="false">Eraser</button>
  <button id="select" aria-pressed="false" title="Circle writing to move or resize it">Select</button>
  <button id="undo">Undo</button>
  <button id="clear">Clear</button>
  <button id="finger" aria-pressed="false" title="Allow drawing with a finger">Finger</button>
  <button id="lock" aria-pressed="false" title="Stop the page sliding left and right">Lock sides</button>
  <button id="hide" title="Hide all the buttons to leave more room for writing">Hide</button>
  <span class="spacer"></span>
  <button id="laptop" aria-pressed="false">Laptop</button>
  <button id="copy">Copy</button>
  <button id="check" class="primary">Check</button>
</div>
<div class="bar sizes" id="sizes">
  <label>Pen <input id="pensize" type="range" min="0.4" max="3" step="0.1" value="1" aria-label="Pen thickness"></label>
  <label>Eraser <input id="erasersize" type="range" min="5" max="45" step="1" value="13" aria-label="Eraser size"></label>
</div>
<div class="pad" id="pad">
  <canvas id="c"></canvas>
  <button id="show" class="menubtn" hidden title="Bring the buttons back">Menu</button>
  <div class="hint" id="hint">Write your answer with Apple Pencil, then tap Check and pick your AI app. Drag with a finger to move the page, and pinch with two fingers to zoom.</div>
  <div class="status" id="status" role="status"></div>
  <div class="sheet" id="sheet" hidden>
    <strong>Send answers to your laptop</strong>
    <p>On the laptop, open the receive page and type the code it shows:</p>
    <div class="row">
      <a class="url" id="recvurl" target="_blank" rel="noopener"></a>
      <button id="copylink">Copy link</button>
    </div>
    <div class="row">
      <input id="code" type="text" maxlength="9" autocomplete="off" autocapitalize="characters" autocorrect="off" spellcheck="false" placeholder="CODE" aria-label="Pairing code">
      <button id="pair" class="primary">Connect</button>
    </div>
    <p id="sheetmsg"></p>
    <div class="row">
      <button id="unpair">Stop sending to laptop</button>
      <button id="closesheet">Close</button>
    </div>
  </div>
</div>

let eraserPos = null;   // where the eraser is, so its circle can be shown

    await navigator.share({ files: [new File([blob], 'answer.png', { type: 'image/png' })], text: ASK });
    say('Sent. Clear the pad for your next answer.');
  } catch (err) { if (err && err.name !== 'AbortError') say('Sending did not work. Try Copy.', 4000); }
};

function setTool(t) {
  tool = tool === t ? 'pen' : t;                         // tapping the active tool goes back to the pen
  for (const name of ['eraser', 'select']) { $(name).classList.toggle('on', tool === name); $(name).setAttribute('aria-pressed', tool === name); }
  sel = null; lasso = null; eraserPos = null; redraw();
  if (tool === 'select') say('Circle writing, then drag it. Drag the dot to resize, or tap Delete.', 3500);
}
$('eraser').onclick = () => setTool('eraser');
$('select').onclick = () => setTool('select');
$('finger').onclick = () => { fingerOk = !fingerOk; $('finger').classList.toggle('on', fingerOk); $('finger').setAttribute('aria-pressed', fingerOk); };
function showLock() { $('lock').classList.toggle('on', lockSides); $('lock').setAttribute('aria-pressed', lockSides); }
$('lock').onclick = () => {
  lockSides = !lockSides; showLock();
  try { localStorage.setItem('answerpad-lock', lockSides ? '1' : '0'); } catch (e) {}
  say(lockSides ? 'The page now only moves up and down.' : 'The page moves in every direction again.');
};
showLock();
// Hide tucks every button away so the whole window is paper; a small Menu button brings them back.
let menuHidden = false;
try { menuHidden = localStorage.getItem('answerpad-hide') === '1'; } catch (e) {}
function showMenu() { $('bar').hidden = $('sizes').hidden = menuHidden; $('show').hidden = !menuHidden; }
function setMenu(hidden) {
  menuHidden = hidden; showMenu();
  try { localStorage.setItem('answerpad-hide', hidden ? '1' : '0'); } catch (e) {}
}
// The layout changes a moment after the tap ends, so the Pencil or finger that pressed the button is
// never left pressing on something that just moved or vanished.
$('hide').onclick = () => { $('hide').blur(); setTimeout(() => { resetGestures(); setMenu(true); say('Tap Menu to bring the buttons back.'); }, 60); };
$('show').onclick = () => { $('show').blur(); setTimeout(() => { resetGestures(); setMenu(false); }, 60); };
showMenu();
$('pensize').value = penW; $('erasersize').value = eraseR;
function sized(kind) {
  sizeHint = kind; redraw();
  clearTimeout(sizeTimer); sizeTimer = setTimeout(() => { sizeHint = null; redraw(); }, 900);
}
$('pensize').oninput = e => {
  penW = +e.target.value; try { localStorage.setItem('answerpad-pen', penW); } catch (err) {}
  sized('pen');
};
$('erasersize').oninput = e => {
  eraseR = +e.target.value; try { localStorage.setItem('answerpad-eraser', eraseR); } catch (err) {}
  sized('eraser');
};
$('undo').onclick = () => {
  if (!history.length) { say('Nothing to undo'); return; }
  strokes = history.pop(); sel = null; lasso = null; setScroll(scrollX, scrollY); redraw();
};
$('clear').onclick = () => {
  if (!strokes.length) return;
  if (sel) {
    remember(strokes); strokes = strokes.filter(s => !sel.ids.has(s)); sel = null; setScroll(scrollX, scrollY); redraw();
    say('Deleted. Undo brings it back.');
    return;
  }
  remember(strokes); strokes = []; sel = null; lasso = null; zoom = 1; setScroll(0, 0); redraw();
  say('Cleared. Undo brings it back.');
};
document.addEventListener('gesturestart', e => e.preventDefault());

resize();
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
