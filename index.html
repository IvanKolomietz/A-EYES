<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Answer Pad</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Answer Pad">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f1f4f3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111615" media="(prefers-color-scheme: dark)">
<style>
:root {
  --bg: #f1f4f3; --panel: #ffffff; --paper: #fdfdfb; --grid: #e2e9e6;
  --fg: #18211e; --muted: #5c6a65; --line: #d3dbd7;
  --accent: #1f6f5c; --accent-fg: #ffffff; --ink: #14201c; --good: #1c7a43; --bad: #b3261e;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #111615; --panel: #1a2120; --paper: #151b1a; --grid: #222b29;
    --fg: #e6ecea; --muted: #9aa8a3; --line: #2d3836;
    --accent: #5fc2a8; --accent-fg: #0d1614; --ink: #e9efed; --good: #6fd195; --bad: #f08a80;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; overflow: hidden; overscroll-behavior: none; }
body {
  background: var(--bg); color: var(--fg); font: 15px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
  display: flex; flex-direction: column; gap: 8px;
  padding: max(8px, env(safe-area-inset-top)) max(8px, env(safe-area-inset-right)) max(8px, env(safe-area-inset-bottom)) max(8px, env(safe-area-inset-left));
}
.pad {
  position: relative; flex: 1 1 auto; min-height: 0; border: 1px solid var(--line); border-radius: 12px; overflow: hidden;
  background-color: var(--paper);
  background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 26px 26px;
}
canvas { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; display: block; }
.hint { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; padding: 0 20px; color: var(--muted); pointer-events: none; }
.status {
  position: absolute; left: 50%; bottom: 10px; transform: translateX(-50%); max-width: calc(100% - 20px);
  background: var(--fg); color: var(--panel); border-radius: 999px; padding: 6px 14px; font-size: 13px; font-weight: 600;
  pointer-events: none; opacity: 0; transition: opacity .2s; text-align: center;
}
.status.show { opacity: 1; }
.bar { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.bar .spacer { flex: 1 1 0; }
button {
  font: 500 14px system-ui, -apple-system, sans-serif; color: var(--fg); background: var(--panel);
  border: 1px solid var(--line); border-radius: 10px; padding: 9px 12px; touch-action: manipulation; cursor: pointer;
}
button:active { opacity: .6; }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
button.on { background: var(--fg); color: var(--panel); border-color: var(--fg); }
button.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); font-weight: 600; padding: 9px 18px; }
[hidden] { display: none !important; }
.sheet {
  position: absolute; z-index: 2; top: 8px; left: 8px; right: 8px; max-width: 380px; margin: 0 auto;
  background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px;
  display: flex; flex-direction: column; gap: 10px; box-shadow: 0 6px 24px rgba(0, 0, 0, .18);
}
.sheet p { margin: 0; font-size: 13px; color: var(--muted); }
.sheet .url { color: var(--fg); font-weight: 600; overflow-wrap: anywhere; -webkit-user-select: text; user-select: text; }
.sheet .row { display: flex; flex-wrap: wrap; gap: 8px; }
.sheet input {
  flex: 1 1 120px; min-width: 0; font: 600 20px ui-monospace, Menlo, Consolas, monospace; letter-spacing: .12em; text-transform: uppercase;
  color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px;
  -webkit-user-select: text; user-select: text;
}
@media (prefers-reduced-motion: reduce) { .status { transition: none; } }
</style>
</head>
<body>
<!-- Buttons sit above the paper so a resting hand can't press them. -->
<div class="bar" id="bar">
  <button id="eraser" aria-pressed="false">Eraser</button>
  <button id="undo">Undo</button>
  <button id="clear">Clear</button>
  <button id="finger" aria-pressed="false" title="Allow drawing with a finger">Finger</button>
  <span class="spacer"></span>
  <button id="laptop" aria-pressed="false">Laptop</button>
  <button id="copy">Copy</button>
  <button id="check" class="primary">Check</button>
</div>
<div class="pad" id="pad">
  <canvas id="c"></canvas>
  <div class="hint" id="hint">Write your answer with Apple Pencil, then tap Check and pick your AI app.</div>
  <div class="status" id="status" role="status"></div>
  <div class="sheet" id="sheet" hidden>
    <strong>Send answers to your laptop</strong>
    <p>On the laptop, open <span class="url" id="recvurl"></span> and type the code it shows.</p>
    <div class="row">
      <input id="code" type="text" maxlength="6" autocomplete="off" autocapitalize="characters" autocorrect="off" spellcheck="false" placeholder="CODE" aria-label="Pairing code">
      <button id="pair" class="primary">Connect</button>
    </div>
    <p id="sheetmsg"></p>
    <div class="row">
      <button id="unpair">Stop sending to laptop</button>
      <button id="closesheet">Close</button>
    </div>
  </div>
</div>

<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
const $ = id => document.getElementById(id);
const canvas = $('c'), ctx = canvas.getContext('2d');
let strokes = [], current = null, erasing = false, fingerOk = false;
let dpr = 1, W = 0, H = 0, statusTimer = null;

function inkColor() { return getComputedStyle(document.documentElement).getPropertyValue('--ink').trim() || '#111'; }

function paint(g, list, scale, color, ox = 0, oy = 0) {
  g.lineCap = 'round'; g.lineJoin = 'round';
  for (const s of list) {
    g.globalCompositeOperation = s.erase ? 'destination-out' : 'source-over';
    g.strokeStyle = g.fillStyle = color;
    const base = s.erase ? 26 : 2.6, pts = s.pts;
    if (pts.length === 1) {
      g.beginPath(); g.arc((pts[0].x - ox) * scale, (pts[0].y - oy) * scale, base * scale / 2, 0, 7); g.fill(); continue;
    }
    for (let i = 1; i < pts.length; i++) {
      const a = pts[i - 1], b = pts[i];
      g.lineWidth = base * (s.erase ? 1 : 0.55 + 0.9 * (a.p + b.p) / 2) * scale;
      g.beginPath(); g.moveTo((a.x - ox) * scale, (a.y - oy) * scale); g.lineTo((b.x - ox) * scale, (b.y - oy) * scale); g.stroke();
    }
  }
  g.globalCompositeOperation = 'source-over';
}

function redraw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  paint(ctx, strokes, dpr, inkColor());
  $('hint').hidden = strokes.length > 0;
}

function resize() {
  const r = $('pad').getBoundingClientRect();
  dpr = window.devicePixelRatio || 1; W = r.width; H = r.height;
  const cw = Math.max(1, Math.round(W * dpr)), ch = Math.max(1, Math.round(H * dpr));
  if (cw === canvas.width && ch === canvas.height) return;   // resizing wipes the canvas, so only do it when the size really changed
  canvas.width = cw; canvas.height = ch;
  redraw();
}
new ResizeObserver(resize).observe($('pad'));
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', redraw);

function pt(e) {
  const r = canvas.getBoundingClientRect();
  return { x: e.clientX - r.left, y: e.clientY - r.top, p: e.pointerType === 'pen' ? (e.pressure || 0.5) : 0.5 };
}
let lastPen = 0;   // when the Pencil last touched the paper

// Stop Safari's own touch gestures (scroll bounce, double-tap zoom, long-press) from
// starting under a resting palm: when one of those starts, it cuts the Pencil stroke off.
for (const type of ['touchstart', 'touchmove', 'touchend']) {
  canvas.addEventListener(type, e => e.preventDefault(), { passive: false });
}
const inUi = e => !!(e.target.closest && e.target.closest('.bar, .sheet'));
document.addEventListener('touchmove', e => { if (!inUi(e)) e.preventDefault(); }, { passive: false });
for (const type of ['contextmenu', 'selectstart', 'dblclick']) document.addEventListener(type, e => { if (!inUi(e)) e.preventDefault(); });

// Ignore button presses made by a hand while the Pencil is writing or has just lifted.
let blockTap = false;
$('bar').addEventListener('pointerdown', e => { blockTap = e.pointerType === 'touch' && (current !== null || performance.now() - lastPen < 800); }, true);
$('bar').addEventListener('click', e => { if (blockTap) { e.stopPropagation(); e.preventDefault(); blockTap = false; } }, true);

canvas.addEventListener('pointerdown', e => {
  if (e.pointerType === 'touch' && !fingerOk) return;   // Pencil only unless Finger is on
  e.preventDefault();
  if (e.pointerType === 'pen') lastPen = performance.now();
  try { canvas.setPointerCapture(e.pointerId); } catch (err) {}
  current = { erase: erasing, pts: [pt(e)], id: e.pointerId };
  strokes.push(current); redraw();
});
canvas.addEventListener('pointermove', e => {
  if (!current || e.pointerId !== current.id) return;
  e.preventDefault();
  const evs = e.getCoalescedEvents ? e.getCoalescedEvents() : [];
  for (const ev of (evs.length ? evs : [e])) {
    const p = pt(ev), last = current.pts[current.pts.length - 1];
    current.pts.push(p);
    paint(ctx, [{ erase: current.erase, pts: [last, p] }], dpr, inkColor());
  }
});
const end = e => {
  if (!current || e.pointerId !== current.id) return;
  if (e.pointerType === 'pen') lastPen = performance.now();
  current = null;
};
canvas.addEventListener('pointerup', end);
canvas.addEventListener('pointercancel', end);
canvas.addEventListener('lostpointercapture', end);

function hasInk() { return strokes.some(s => !s.erase); }

function say(text, ms = 2600) {
  const el = $('status'); el.textContent = text; el.classList.add('show');
  clearTimeout(statusTimer); statusTimer = setTimeout(() => el.classList.remove('show'), ms);
}

// Picture of the work: dark ink on white, cropped to what was written, so any AI can read it.
function snapshot() {
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  for (const s of strokes) if (!s.erase) for (const p of s.pts) { x0 = Math.min(x0, p.x); y0 = Math.min(y0, p.y); x1 = Math.max(x1, p.x); y1 = Math.max(y1, p.y); }
  const m = 28; x0 = Math.max(0, x0 - m); y0 = Math.max(0, y0 - m); x1 = Math.min(W, x1 + m); y1 = Math.min(H, y1 + m);
  const w = Math.max(60, x1 - x0), h = Math.max(60, y1 - y0);
  const scale = Math.max(1, Math.min(3, 1200 / Math.max(w, h)));
  const layer = document.createElement('canvas');
  layer.width = Math.round(w * scale); layer.height = Math.round(h * scale);
  paint(layer.getContext('2d'), strokes, scale, '#111111', x0, y0);
  const out = document.createElement('canvas'); out.width = layer.width; out.height = layer.height;
  const g = out.getContext('2d'); g.fillStyle = '#ffffff'; g.fillRect(0, 0, out.width, out.height); g.drawImage(layer, 0, 0);
  return new Promise((res, rej) => out.toBlob(b => b ? res(b) : rej(new Error('no image')), 'image/png'));
}

const ASK = "Here's my handwritten answer. Is it correct?";

async function copyImage() {
  // Safari needs the ClipboardItem made inside the tap, with the image supplied as a promise.
  await navigator.clipboard.write([new ClipboardItem({ 'image/png': snapshot() })]);
}

$('copy').onclick = async () => {
  if (!hasInk()) { say('Write something first'); return; }
  try { await copyImage(); say('Copied. Paste it into your AI chat.'); }
  catch (err) { say('Copy is not available in this browser.', 4000); }
};

let canShareFiles = false;
try {
  const probe = new File([new Blob(['x'], { type: 'image/png' })], 'answer.png', { type: 'image/png' });
  canShareFiles = !!(navigator.canShare && navigator.canShare({ files: [probe] }));
} catch (e) {}

// Check: hand the picture to the AI app the student picks in the share menu.
// ---------- sending to a paired laptop ----------
const CODE_KEY = 'answerpad-laptop';
let laptopCode = null, peer = null, conn = null, ackWait = null;
try { laptopCode = localStorage.getItem(CODE_KEY); } catch (e) {}

function waitFor(setup, ms) {
  return new Promise((res, rej) => {
    const t = setTimeout(() => rej(new Error('timeout')), ms);
    setup(v => { clearTimeout(t); res(v); }, e => { clearTimeout(t); rej(e); });
  });
}

async function connectLaptop() {
  if (!window.Peer) throw new Error('nolib');
  if (conn && conn.open) return conn;
  if (!peer || peer.destroyed) peer = new Peer();
  else if (peer.disconnected) peer.reconnect();
  if (!peer.open) await waitFor((ok, bad) => { peer.once('open', ok); peer.once('error', bad); }, 10000);
  const c = peer.connect('answerpad-' + laptopCode, { reliable: true });
  await waitFor((ok, bad) => { c.once('open', ok); c.once('error', bad); peer.once('error', bad); }, 12000);
  c.on('data', d => { if (d && d.type === 'ack' && ackWait) { ackWait(); ackWait = null; } });
  c.on('close', () => { if (conn === c) conn = null; });
  conn = c;
  return c;
}

async function sendToLaptop() {
  say('Sending to your laptop…', 30000);
  try {
    const c = await connectLaptop();
    const png = await (await snapshot()).arrayBuffer();
    const acked = waitFor(ok => { ackWait = ok; }, 10000);
    c.send({ type: 'answer', png });
    await acked;
    say('Sent to your laptop.');
  } catch (err) {
    conn = null; ackWait = null;
    say('Could not reach the laptop. Is the receive page open there?', 5000);
  }
}

function showLaptopState() {
  $('laptop').classList.toggle('on', !!laptopCode);
  $('laptop').setAttribute('aria-pressed', !!laptopCode);
  $('unpair').hidden = !laptopCode;
  $('check').textContent = laptopCode ? 'Send' : 'Check';
}
$('recvurl').textContent = new URL('receive.html', location.href).href.replace(/^https?:\/\//, '');
$('laptop').onclick = () => { $('sheet').hidden = !$('sheet').hidden; if (!$('sheet').hidden) { $('code').value = laptopCode || ''; $('sheetmsg').textContent = laptopCode ? 'Paired. Send goes to your laptop.' : ''; } };
$('closesheet').onclick = () => { $('sheet').hidden = true; };
$('unpair').onclick = () => {
  laptopCode = null; try { localStorage.removeItem(CODE_KEY); } catch (e) {}
  if (conn) conn.close(); conn = null;
  $('code').value = ''; $('sheetmsg').textContent = 'Check uses the share menu again.'; showLaptopState();
};
$('pair').onclick = async () => {
  const code = $('code').value.trim().toUpperCase();
  if (code.length !== 6) { $('sheetmsg').textContent = 'The code is 6 characters.'; return; }
  if (conn) conn.close(); conn = null;
  laptopCode = code; $('sheetmsg').textContent = 'Connecting…'; $('pair').disabled = true;
  try {
    await connectLaptop();
    try { localStorage.setItem(CODE_KEY, code); } catch (e) {}
    $('sheetmsg').textContent = 'Connected. Send now goes to your laptop.';
    setTimeout(() => { $('sheet').hidden = true; }, 1200);
  } catch (err) {
    laptopCode = null; try { laptopCode = localStorage.getItem(CODE_KEY); } catch (e) {}
    $('sheetmsg').textContent = !window.Peer ? 'Could not load the connection library. Check your internet.'
      : 'Could not connect. Check the code and that the laptop page is open.';
  } finally { $('pair').disabled = false; showLaptopState(); }
};
showLaptopState();

$('check').onclick = async () => {
  if (!hasInk()) { say('Write something first'); return; }
  if (laptopCode) { sendToLaptop(); return; }
  if (!canShareFiles) {
    try { await copyImage(); say('Copied. Paste it into your AI chat to check it.', 4000); }
    catch (err) { say('This browser cannot send the picture.', 4000); }
    return;
  }
  try {
    const blob = await snapshot();
    await navigator.share({ files: [new File([blob], 'answer.png', { type: 'image/png' })], text: ASK });
    say('Sent. Clear the pad for your next answer.');
  } catch (err) { if (err && err.name !== 'AbortError') say('Sending did not work. Try Copy.', 4000); }
};

$('eraser').onclick = () => { erasing = !erasing; $('eraser').classList.toggle('on', erasing); $('eraser').setAttribute('aria-pressed', erasing); };
$('finger').onclick = () => { fingerOk = !fingerOk; $('finger').classList.toggle('on', fingerOk); $('finger').setAttribute('aria-pressed', fingerOk); };
$('undo').onclick = () => { strokes.pop(); redraw(); };
$('clear').onclick = () => { strokes = []; redraw(); };
document.addEventListener('gesturestart', e => e.preventDefault());

resize();
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
