<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Answer Pad</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Answer Pad">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f1f4f3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111615" media="(prefers-color-scheme: dark)">
<style>
:root {
  --bg: #f1f4f3; --panel: #ffffff; --paper: #fdfdfb; --grid: #e2e9e6;
  --fg: #18211e; --muted: #5c6a65; --line: #d3dbd7;
  --accent: #1f6f5c; --accent-fg: #ffffff; --ink: #14201c; --good: #1c7a43; --bad: #b3261e;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #111615; --panel: #1a2120; --paper: #151b1a; --grid: #222b29;
    --fg: #e6ecea; --muted: #9aa8a3; --line: #2d3836;
    --accent: #5fc2a8; --accent-fg: #0d1614; --ink: #e9efed; --good: #6fd195; --bad: #f08a80;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; overflow: hidden; overscroll-behavior: none; }
body {
  background: var(--bg); color: var(--fg); font: 15px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
  display: flex; flex-direction: column; gap: 8px;
  padding: max(8px, env(safe-area-inset-top)) max(8px, env(safe-area-inset-right)) max(8px, env(safe-area-inset-bottom)) max(8px, env(safe-area-inset-left));
}
.pad {
  position: relative; flex: 1 1 auto; min-height: 0; border: 1px solid var(--line); border-radius: 12px; overflow: hidden;
  background-color: var(--paper);
  background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 26px 26px;
}
canvas { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; display: block; }
.hint { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; padding: 0 20px; color: var(--muted); pointer-events: none; }
.status {
  position: absolute; left: 50%; bottom: 10px; transform: translateX(-50%); max-width: calc(100% - 20px);
  background: var(--fg); color: var(--panel); border-radius: 999px; padding: 6px 14px; font-size: 13px; font-weight: 600;
  pointer-events: none; opacity: 0; transition: opacity .2s; text-align: center;
}
.status.show { opacity: 1; }
.bar { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.bar .spacer { flex: 1 1 0; }
button {
  font: 500 14px system-ui, -apple-system, sans-serif; color: var(--fg); background: var(--panel);
  border: 1px solid var(--line); border-radius: 10px; padding: 9px 12px; touch-action: manipulation; cursor: pointer;
}
button:active { opacity: .6; }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
button.on { background: var(--fg); color: var(--panel); border-color: var(--fg); }
button.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); font-weight: 600; padding: 9px 18px; }
[hidden] { display: none !important; }
.sheet {
  position: absolute; z-index: 2; top: 8px; left: 8px; right: 8px; max-width: 380px; margin: 0 auto;
  background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px;
  display: flex; flex-direction: column; gap: 10px; box-shadow: 0 6px 24px rgba(0, 0, 0, .18);
}
.sheet p { margin: 0; font-size: 13px; color: var(--muted); }
.sheet .url { flex: 1 1 160px; min-width: 0; align-self: center; font-size: 13px; color: var(--accent); font-weight: 600; overflow-wrap: anywhere; -webkit-user-select: text; user-select: text; }
.sheet .row { display: flex; flex-wrap: wrap; gap: 8px; }
.sheet input {
  flex: 1 1 120px; min-width: 0; font: 600 20px ui-monospace, Menlo, Consolas, monospace; letter-spacing: .12em; text-transform: uppercase;
  color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px;
  -webkit-user-select: text; user-select: text;
}
@media (prefers-reduced-motion: reduce) { .status { transition: none; } }
</style>
</head>
<body>
<!-- Buttons sit above the paper so a resting hand can't press them. -->
<div class="bar" id="bar">
  <button id="eraser" aria-pressed="false">Eraser</button>
  <button id="select" aria-pressed="false" title="Circle writing to move or resize it">Select</button>
  <button id="undo">Undo</button>
  <button id="clear">Clear</button>
  <button id="finger" aria-pressed="false" title="Allow drawing with a finger">Finger</button>
  <span class="spacer"></span>
  <button id="laptop" aria-pressed="false">Laptop</button>
  <button id="copy">Copy</button>
  <button id="check" class="primary">Check</button>
</div>
<div class="pad" id="pad">
  <canvas id="c"></canvas>
  <div class="hint" id="hint">Write your answer with Apple Pencil, then tap Check and pick your AI app. Drag with a finger to move the page for more room.</div>
  <div class="status" id="status" role="status"></div>
  <div class="sheet" id="sheet" hidden>
    <strong>Send answers to your laptop</strong>
    <p>On the laptop, open the receive page and type the code it shows:</p>
    <div class="row">
      <a class="url" id="recvurl" target="_blank" rel="noopener"></a>
      <button id="copylink">Copy link</button>
    </div>
    <div class="row">
      <input id="code" type="text" maxlength="9" autocomplete="off" autocapitalize="characters" autocorrect="off" spellcheck="false" placeholder="CODE" aria-label="Pairing code">
      <button id="pair" class="primary">Connect</button>
    </div>
    <p id="sheetmsg"></p>
    <div class="row">
      <button id="unpair">Stop sending to laptop</button>
      <button id="closesheet">Close</button>
    </div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
const canvas = $('c'), ctx = canvas.getContext('2d');
// A stroke is {pts: [{x, y, p}], w}: points in CSS pixels with pressure, and a thickness multiplier.
// Strokes are never changed once finished; erasing, moving and resizing make new ones, so every
// earlier state can be kept in `history` for Undo.
let strokes = [], history = [], tool = 'pen', fingerOk = false;
let current = null;   // {id, s}: the pen stroke being drawn
let action = null;    // {id, kind: 'erase' | 'lasso' | 'drag', before}: any other gesture in progress
let sel = null;       // {ids: Set of strokes, box}: the current selection
let lasso = null;     // points of the loop being drawn
let drag = null;      // {mode: 'move' | 'scale', start, orig, ids, box}
let dpr = 1, W = 0, H = 0, statusTimer = null;
const BOX_PAD = 10, HANDLE = 9, ERASE_R = 13;
// The page is bigger than the screen: strokes are stored in page positions, and `scrollX` and
// `scrollY` say where the visible part starts. A finger drag moves the page (two fingers when Finger is on).
let scrollX = 0, scrollY = 0, pan = null;
const fingers = new Map();
let eraserPos = null;   // where the eraser is, so its circle can be shown

function css(name, fallback) { return getComputedStyle(document.documentElement).getPropertyValue(name).trim() || fallback; }
function inkColor() { return css('--ink', '#111'); }
function remember(state) { history.push(state); if (history.length > 200) history.shift(); }

function paint(g, list, scale, color, ox = 0, oy = 0) {
  g.lineCap = 'round'; g.lineJoin = 'round'; g.strokeStyle = g.fillStyle = color;
  for (const s of list) {
    const base = 2.6 * (s.w || 1), pts = s.pts;
    if (pts.length === 1) {
      g.beginPath(); g.arc((pts[0].x - ox) * scale, (pts[0].y - oy) * scale, base * scale / 2, 0, 7); g.fill(); continue;
    }
    for (let i = 1; i < pts.length; i++) {

// The loop being drawn and the dashed box with its resize dot.
function overlay(b) {

// While circling or dragging, the page is kept as ready-made pictures, so each screen
// refresh is a couple of image copies instead of redrawing every stroke.
let cache = null, framePending = false;

}
function drawLive() {

function boxOf(list) {

}
function inPoly(p, poly) {

}
function segDist(p, a, b) {

  const t = len ? Math.max(0, Math.min(1, ((p.x - a.x) * dx + (p.y - a.y) * dy) / len)) : 0;
  return Math.hypot(p.x - (a.x + t * dx), p.y - (a.y + t * dy));

// Rub out whatever lies under the eraser, cutting strokes in two where it passes through them.
// Only strokes whose bounding box is near the eraser are looked at, and the screen is
// refreshed once per frame by the caller, so long erasing sessions stay quick.

    if (p.x < bb.x0 - R || p.x > bb.x1 + R || p.y < bb.y0 - R || p.y > bb.y1 + R) { out.push(s); continue; }

      if (Math.hypot(q.x - p.x, q.y - p.y) < R) { hit = true; if (piece.length) { out.push({ pts: piece, w: s.w }); piece = []; } continue; }
      if (piece.length && segDist(p, piece[piece.length - 1], q) < R) { hit = true; out.push({ pts: piece, w: s.w }); piece = []; }

    if (!hit) { out.push(s); continue; }

// How far the selection has been moved, or how much it has been resized, since the drag began.
// Resizing follows the Pencil along the line from the box's top-left corner to where the dot
// was grabbed, so it starts at exactly 1x with no jump.

// Make the move or resize permanent once the Pencil lifts.
function commitDrag() {
  const t = dragShape(), b = drag.box;

    if (!drag.ids.has(s)) return s;
    const n = { pts: s.pts.map(f), w: (s.w || 1) * t.k }; next.add(n); return n;

// The page can be moved in any direction until the writing is about to leave the screen,
// which always leaves most of a screen of empty space on the side you are heading to.
function scrollLimits() {

function setScroll(x, y, lim = scrollLimits()) {
  scrollX = Math.max(lim.x0, Math.min(lim.x1, x)); scrollY = Math.max(lim.y0, Math.min(lim.y1, y));

const fingerAt = () => { let x = 0, y = 0; for (const f of fingers.values()) { x += f.x; y += f.y; } return { x: x / fingers.size, y: y / fingers.size }; };

function resize() {

matchMedia('(prefers-color-scheme: dark)').addEventListener('change', redraw);

function pt(e) {

// Ignore button presses made by a hand while the Pencil is writing or has just lifted.

  if (!action || e.pointerId !== action.id) return;

    if (tool === 'eraser') setTool('eraser');            // lifting the Pencil after erasing goes back to the pen
  } else if (action.kind === 'lasso') {
    const loop = lasso; lasso = null;
    const picked = loop.length < 3 ? [] : strokes.filter(s => s.pts.filter(q => inPoly(q, loop)).length >= s.pts.length * 0.5);
    sel = picked.length ? { ids: new Set(picked), box: boxOf(picked) } : null;
    if (!sel && loop.length > 8) say('Circle some writing to select it');
  } else {
    commitDrag();
    drag = null;
  }
  action = null; cache = null; redraw();
};
canvas.addEventListener('wheel', e => { e.preventDefault(); if (!current && !action) setScroll(scrollX + e.deltaX, scrollY + e.deltaY); }, { passive: false });
canvas.addEventListener('pointerup', end);
canvas.addEventListener('pointercancel', end);
canvas.addEventListener('lostpointercapture', end);
canvas.addEventListener('pointerleave', () => { if (eraserPos && !action) { eraserPos = null; frame(); } });

function hasInk() { return strokes.length > 0; }

function say(text, ms = 2600) {
  const el = $('status'); el.textContent = text; el.classList.add('show');
  clearTimeout(statusTimer); statusTimer = setTimeout(() => el.classList.remove('show'), ms);
}

// Picture of the work: dark ink on white, cropped to what was written, so any AI can read it.
function snapshot() {
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  for (const s of strokes) if (!s.erase) for (const p of s.pts) { x0 = Math.min(x0, p.x); y0 = Math.min(y0, p.y); x1 = Math.max(x1, p.x); y1 = Math.max(y1, p.y); }
  const m = 28; x0 -= m; y0 -= m; x1 += m; y1 += m;
  const w = Math.max(60, x1 - x0), h = Math.max(60, y1 - y0);
  const scale = Math.max(1, Math.min(3, 1200 / Math.max(w, h)));
  const layer = document.createElement('canvas');
  layer.width = Math.round(w * scale); layer.height = Math.round(h * scale);
  paint(layer.getContext('2d'), strokes, scale, '#111111', x0, y0);
  const out = document.createElement('canvas'); out.width = layer.width; out.height = layer.height;
  const g = out.getContext('2d'); g.fillStyle = '#ffffff'; g.fillRect(0, 0, out.width, out.height); g.drawImage(layer, 0, 0);
  return new Promise((res, rej) => out.toBlob(b => b ? res(b) : rej(new Error('no image')), 'image/png'));
}

const ASK = "Here's my handwritten answer. Is it correct?";

async function copyImage() {
  // Safari needs the ClipboardItem made inside the tap, with the image supplied as a promise.
  await navigator.clipboard.write([new ClipboardItem({ 'image/png': snapshot() })]);
}

$('copy').onclick = async () => {
  if (!hasInk()) { say('Write something first'); return; }
  try { await copyImage(); say('Copied. Paste it into your AI chat.'); }
  catch (err) { say('Copy is not available in this browser.', 4000); }
};

let canShareFiles = false;
try {
  const probe = new File([new Blob(['x'], { type: 'image/png' })], 'answer.png', { type: 'image/png' });
  canShareFiles = !!(navigator.canShare && navigator.canShare({ files: [probe] }));
} catch (e) {}

// Check: hand the picture to the AI app the student picks in the share menu.
// ---------- sending to a paired laptop ----------
// Answers travel through a public relay (ntfy.sh) as ordinary web traffic, so this works on
// networks that block devices from reaching each other. They are encrypted with a key made
// from the pairing code, which never leaves the two devices.
const CODE_KEY = 'answerpad-laptop', RELAY = 'https://ntfy.sh/';
let laptopCode = null, link = null;
try { laptopCode = localStorage.getItem(CODE_KEY); } catch (e) {}
if (laptopCode && laptopCode.length !== 8) laptopCode = null;

async function deriveLink(code) {
  const enc = new TextEncoder();
  const base = await crypto.subtle.importKey('raw', enc.encode(code), 'PBKDF2', false, ['deriveBits']);
  const bits = new Uint8Array(await crypto.subtle.deriveBits({ name: 'PBKDF2', salt: enc.encode('answer-pad-v1'), iterations: 150000, hash: 'SHA-256' }, base, 512));
  const topic = 'answerpad-' + Array.from(bits.slice(0, 16), b => b.toString(16).padStart(2, '0')).join('');
  const key = await crypto.subtle.importKey('raw', bits.slice(32), 'AES-GCM', false, ['encrypt', 'decrypt']);
  return { topic, key, code };
}
async function getLink() { if (!link || link.code !== laptopCode) link = await deriveLink(laptopCode); return link; }
function nonce() { return Array.from(crypto.getRandomValues(new Uint8Array(8)), b => b.toString(16).padStart(2, '0')).join(''); }

// Listen for the laptop's reply, publish something to it, and wait for the reply we want.
function ask(l, publish, want, ms) {
  return new Promise((res, rej) => {
    const es = new EventSource(RELAY + l.topic + 'r/sse');
    let started = false;
    const done = (fn, v) => { clearTimeout(t); es.close(); fn(v); };
    const t = setTimeout(() => done(rej, new Error('noreply')), ms);
    es.onmessage = e => { try { const m = JSON.parse(e.data); if (m.event === 'message' && m.message === want) done(res); } catch (err) {} };
    es.onopen = () => { if (started) return; started = true; publish().catch(err => done(rej, err)); };
  });
}
async function post(l, body, headers) {
  const r = await fetch(RELAY + l.topic, { method: 'PUT', body, headers });
  if (!r.ok) throw new Error('http' + r.status);
}

async function pingLaptop() {
  const l = await getLink(), n = nonce();
  await ask(l, () => post(l, 'ping:' + n), 'pong:' + n, 8000);
}

async function sendToLaptop() {
  say('Sending to your laptop…', 30000);
  let posted = false;
  try {
    const l = await getLink();
    const png = await (await snapshot()).arrayBuffer();
    const iv = crypto.getRandomValues(new Uint8Array(12));
    const ct = new Uint8Array(await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, l.key, png));
    const body = new Uint8Array(12 + ct.length); body.set(iv); body.set(ct, 12);
    const n = nonce();
    await ask(l, async () => { await post(l, body, { Filename: n + '.bin' }); posted = true; }, 'got:' + n, 15000);
    say('Sent to your laptop.');
  } catch (err) {
    if (posted) say('Sent, but the laptop did not confirm. Is the receive page open there?', 6000);
    else if (String(err && err.message).includes('429')) say('The relay is busy. Try again in a minute, or use Copy.', 6000);
    else say('Could not send. Check your internet connection.', 6000);
  }
}

function showLaptopState() {
  $('laptop').classList.toggle('on', !!laptopCode);
  $('laptop').setAttribute('aria-pressed', !!laptopCode);
  $('unpair').hidden = !laptopCode;
  $('check').textContent = laptopCode ? 'Send' : 'Check';
}
const RECEIVE_URL = new URL('receive.html', location.href).href;
$('recvurl').href = RECEIVE_URL;
$('recvurl').textContent = RECEIVE_URL.replace(/^https?:\/\//, '');
$('copylink').onclick = async () => {
  try { await navigator.clipboard.writeText(RECEIVE_URL); $('sheetmsg').textContent = 'Link copied. Send it to your laptop.'; }
  catch (err) { $('sheetmsg').textContent = 'Could not copy. Type the address on your laptop instead.'; }
};
$('laptop').onclick = () => { $('sheet').hidden = !$('sheet').hidden; if (!$('sheet').hidden) { $('code').value = laptopCode || ''; $('sheetmsg').textContent = laptopCode ? 'Paired. Send goes to your laptop.' : ''; } };
$('closesheet').onclick = () => { $('sheet').hidden = true; };
$('unpair').onclick = () => {
  laptopCode = null; link = null; try { localStorage.removeItem(CODE_KEY); } catch (e) {}
  $('code').value = ''; $('sheetmsg').textContent = 'Check uses the share menu again.'; showLaptopState();
};
$('pair').onclick = async () => {
  const code = $('code').value.toUpperCase().replace(/[^A-Z0-9]/g, '');
  if (code.length !== 8) { $('sheetmsg').textContent = 'The code is 8 characters.'; return; }
  laptopCode = code; $('sheetmsg').textContent = 'Connecting…'; $('pair').disabled = true;
  try {
    await pingLaptop();
    try { localStorage.setItem(CODE_KEY, code); } catch (e) {}
    $('sheetmsg').textContent = 'Connected. Send now goes to your laptop.';
    setTimeout(() => { $('sheet').hidden = true; }, 1200);
  } catch (err) {
    laptopCode = null; try { laptopCode = localStorage.getItem(CODE_KEY); } catch (e) {}
    if (laptopCode && laptopCode.length !== 8) laptopCode = null;
    $('sheetmsg').textContent = 'Could not connect. Check the code and that the laptop page is open.';
  } finally { $('pair').disabled = false; showLaptopState(); }
};
showLaptopState();

$('check').onclick = async () => {
  if (!hasInk()) { say('Write something first'); return; }
  if (laptopCode) { sendToLaptop(); return; }
  if (!canShareFiles) {
    try { await copyImage(); say('Copied. Paste it into your AI chat to check it.', 4000); }
    catch (err) { say('This browser cannot send the picture.', 4000); }
    return;
  }
  try {
    const blob = await snapshot();
    await navigator.share({ files: [new File([blob], 'answer.png', { type: 'image/png' })], text: ASK });
    say('Sent. Clear the pad for your next answer.');
  } catch (err) { if (err && err.name !== 'AbortError') say('Sending did not work. Try Copy.', 4000); }
};

function setTool(t) {
  tool = tool === t ? 'pen' : t;                         // tapping the active tool goes back to the pen
  for (const name of ['eraser', 'select']) { $(name).classList.toggle('on', tool === name); $(name).setAttribute('aria-pressed', tool === name); }
  sel = null; lasso = null; eraserPos = null; redraw();
  if (tool === 'select') say('Circle writing, then drag it. Drag the dot to resize, or tap Delete.', 3500);
}
$('eraser').onclick = () => setTool('eraser');
$('select').onclick = () => setTool('select');
$('finger').onclick = () => { fingerOk = !fingerOk; $('finger').classList.toggle('on', fingerOk); $('finger').setAttribute('aria-pressed', fingerOk); };
$('undo').onclick = () => {
  if (!history.length) { say('Nothing to undo'); return; }
  strokes = history.pop(); sel = null; lasso = null; setScroll(scrollX, scrollY); redraw();
};
$('clear').onclick = () => {
  if (!strokes.length) return;
  if (sel) {
    remember(strokes); strokes = strokes.filter(s => !sel.ids.has(s)); sel = null; setScroll(scrollX, scrollY); redraw();
    say('Deleted. Undo brings it back.');
    return;
  }
  remember(strokes); strokes = []; sel = null; lasso = null; setScroll(0, 0); redraw();
  say('Cleared. Undo brings it back.');
};
document.addEventListener('gesturestart', e => e.preventDefault());

resize();
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
